<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-xEtOBsGBaEKi3EH9HqA1NaB+AQCBxyiqa+Lp8owM8rg='">
<title>Valcraft operator answers</title>
<style>
:root {
  --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #d6d3d1;
  --card: #ffffff; --accent: #1d4ed8; --rec: #15803d; --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c;
    --card: #292524; --accent: #93c5fd; --rec: #86efac; --warn: #fcd34d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 0.875rem; margin: 0 0 16px; overflow-wrap: anywhere; }
.summary { white-space: pre-wrap; margin: 0 0 24px; }
fieldset { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 20px; padding: 16px; min-width: 0; }
legend { font-weight: 600; padding: 0 6px; }
.prompt { font-weight: 600; white-space: pre-wrap; margin: 0 0 8px; }
.context { white-space: pre-wrap; margin: 0 0 8px; }
.origin { color: var(--muted); font-size: 0.875rem; margin: 0 0 8px; overflow-wrap: anywhere; }
.blocks { font-size: 0.9375rem; margin: 0 0 8px; white-space: pre-wrap; }
details.excerpts { margin: 0 0 12px; }
details.excerpts summary { cursor: pointer; color: var(--accent); font-size: 0.9375rem; }
blockquote { margin: 8px 0 2px; padding: 6px 12px; border-left: 3px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9375rem; }
blockquote + .source { margin: 0 0 8px 15px; }
.effect, .tradeoff { display: block; white-space: pre-wrap; font-size: 0.9375rem; }
.effect strong, .tradeoff strong, .blocks strong { font-weight: 600; }
.facts, .section ul { margin: 0 0 12px; padding-left: 20px; }
.facts li, .section li { white-space: pre-wrap; overflow-wrap: anywhere; }
.source { color: var(--muted); font-size: 0.875rem; }
.unchecked { color: var(--warn); font-size: 0.875rem; font-weight: 600; }
.section h3 { font-size: 1rem; margin: 12px 0 4px; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 6px; cursor: pointer; }
.option:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.option input { margin-top: 5px; flex: none; }
.label { font-weight: 600; white-space: pre-wrap; }
.badge { color: var(--rec); font-size: 0.8125rem; font-weight: 700; margin-left: 6px; }
.detail, .reason { display: block; white-space: pre-wrap; color: var(--muted); font-size: 0.9375rem; }
.reason { color: var(--rec); }
.none { font-style: italic; }
label.note { display: block; margin-top: 10px; color: var(--muted); font-size: 0.875rem; }
textarea { width: 100%; font: 0.875rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); cursor: pointer; }
#result { margin-top: 20px; }
#result[hidden] { display: none; }
#status { font-weight: 600; }
#warnings { color: var(--warn); padding-left: 20px; }
.error { color: var(--warn); font-weight: 600; white-space: pre-wrap; }
</style>
</head>
<body>
<main id="app">
<noscript><p class="error">This page needs JavaScript to build the answer block.</p></noscript>
</main>
<script type="application/json" id="valcraft-set" data-digest="{{DIGEST}}">{{SET_JSON}}</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var slot = document.getElementById("valcraft-set");

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function labelled(cls, label, text) {
    var node = el("span", cls);
    node.appendChild(el("strong", null, label));
    node.appendChild(document.createTextNode(String(text)));
    return node;
  }

  function fail(message) {
    app.appendChild(el("p", "error", message));
  }

  var set;
  try {
    set = JSON.parse(slot.textContent);
  } catch (e) {
    fail("The question set could not be read: " + e.message);
    return;
  }
  var digest = slot.getAttribute("data-digest") || "";
  if (!set || !Array.isArray(set.questions) || typeof set.run !== "string" || typeof set.set !== "string" || !/^[0-9a-f]{64}$/.test(digest)) {
    fail("The question set is incomplete. Ask Foreman to write the page again.");
    return;
  }

  if (set.title) document.title = set.title;
  app.appendChild(el("h1", null, set.title || "Valcraft operator answers"));
  app.appendChild(el("p", "meta", "Run " + set.run + " · set " + set.set + " · " + set.questions.length + " question" + (set.questions.length === 1 ? "" : "s")));
  if (set.summary) app.appendChild(el("p", "summary", set.summary));

  var form = el("form");
  form.addEventListener("submit", function (event) { event.preventDefault(); respond(); });
  app.appendChild(form);

  var readers = [];

  set.questions.forEach(function (q) {
    var multi = q.kind === "choice" && q.multi === true;
    var name = "q-" + q.id;
    var box = el("fieldset");
    box.appendChild(el("legend", null, q.id));
    box.appendChild(el("p", "prompt", q.prompt));
    var origin = q.origin || {};
    var meta = [];
    if (origin.task) meta.push(origin.task);
    if (Array.isArray(origin.ids) && origin.ids.length) meta.push(origin.ids.join(", "));
    if (origin.report) meta.push("raised in " + origin.report);
    if (meta.length) box.appendChild(el("p", "origin", meta.join(" · ")));
    if (q.context) box.appendChild(el("p", "context", q.context));
    if (Array.isArray(q.blocks) && q.blocks.length) {
      box.appendChild(labelled("blocks", "Waiting on this answer: ", q.blocks.join("; ")));
    }

    if (Array.isArray(q.excerpts) && q.excerpts.length) {
      var excerpts = el("details", "excerpts");
      excerpts.appendChild(el("summary", null, "Source excerpts (" + q.excerpts.length + ")"));
      q.excerpts.forEach(function (excerpt) {
        excerpts.appendChild(el("blockquote", null, excerpt.text));
        excerpts.appendChild(el("p", "source", excerpt.source ? "from " + excerpt.source : "(unchecked)"));
      });
      box.appendChild(excerpts);
    }

    if (Array.isArray(q.facts) && q.facts.length) {
      var facts = el("ul", "facts");
      q.facts.forEach(function (fact) {
        var item = el("li", null, fact.text);
        item.appendChild(document.createTextNode(" "));
        if (fact.source) item.appendChild(el("span", "source", "(" + fact.source + ")"));
        else item.appendChild(el("span", "unchecked", "(unchecked)"));
        facts.appendChild(item);
      });
      box.appendChild(facts);
    }

    if (Array.isArray(q.sections)) {
      q.sections.forEach(function (section) {
        var part = el("div", "section");
        part.appendChild(el("h3", null, section.title));
        var list = el("ul");
        (section.items || []).forEach(function (item) {
          var entry = el("li", null, item.text);
          if (item.source) {
            entry.appendChild(document.createTextNode(" "));
            entry.appendChild(el("span", "source", "(" + item.source + ")"));
          }
          if (item.detail) entry.appendChild(el("span", "detail", item.detail));
          list.appendChild(entry);
        });
        if (!(section.items || []).length) list.appendChild(el("li", null, "None."));
        part.appendChild(list);
        box.appendChild(part);
      });
    }

    var inputs = [];
    (q.options || []).forEach(function (option) {
      var row = el("label", "option");
      var input = el("input");
      input.type = multi ? "checkbox" : "radio";
      input.name = name;
      input.value = option.id;
      row.appendChild(input);
      var text = el("span");
      var label = el("span", "label", option.label);
      text.appendChild(label);
      if (option.recommended) text.appendChild(el("span", "badge", "Recommended"));
      if (option.recommended && option.reason) text.appendChild(el("span", "reason", option.reason));
      if (option.detail) text.appendChild(el("span", "detail", option.detail));
      if (option.effect) text.appendChild(labelled("effect", "If chosen: ", option.effect));
      if (option.tradeoff) text.appendChild(labelled("tradeoff", "Trade-off: ", option.tradeoff));
      row.appendChild(text);
      box.appendChild(row);
      inputs.push(input);
    });

    var none = null;
    if (multi) {
      var noneRow = el("label", "option");
      none = el("input");
      none.type = "checkbox";
      noneRow.appendChild(none);
      noneRow.appendChild(el("span", "label none", "None of these"));
      box.appendChild(noneRow);
      none.addEventListener("change", function () {
        if (none.checked) inputs.forEach(function (input) { input.checked = false; });
      });
      inputs.forEach(function (input) {
        input.addEventListener("change", function () { if (input.checked) none.checked = false; });
      });
    }

    var noteLabel = el("label", "note", "Note (optional)");
    var note = el("textarea");
    note.rows = 2;
    noteLabel.appendChild(note);
    box.appendChild(noteLabel);
    form.appendChild(box);

    readers.push(function () {
      var selected = inputs.filter(function (input) { return input.checked; }).map(function (input) { return input.value; });
      var noteText = note.value.trim() ? note.value : null;
      var answered = multi ? (selected.length > 0 || none.checked) : selected.length === 1;
      return { id: q.id, answered: answered, selected: selected, note: noteText };
    });
  });

  form.appendChild(el("button", null, "Respond"));

  var result = el("section");
  result.id = "result";
  result.hidden = true;
  var status = el("p");
  status.id = "status";
  var warnings = el("ul");
  warnings.id = "warnings";
  var output = el("textarea");
  output.rows = Math.min(24, set.questions.length + 3);
  output.readOnly = true;
  output.setAttribute("aria-label", "Answer block");
  result.appendChild(status);
  result.appendChild(warnings);
  result.appendChild(output);
  app.appendChild(result);

  function respond() {
    var lines = ["valcraft-answer run=" + set.run + " set=" + set.set + " digest=" + digest];
    warnings.textContent = "";
    readers.forEach(function (read) {
      var answer = read();
      if (answer.answered) {
        lines.push(answer.id + ": " + JSON.stringify({ selected: answer.selected, note: answer.note }));
      } else {
        lines.push(answer.id + ": unanswered");
        var warning = answer.id + " has no answer, so Foreman will ask it again.";
        if (answer.note) warning += " Its note is not sent without an answer.";
        warnings.appendChild(el("li", null, warning));
      }
    });
    output.value = lines.join("\n") + "\n";
    result.hidden = false;
    output.focus();
    output.select();
    var manual = "Copy the selected block and paste it into the chat with Foreman.";
    function copied() { status.textContent = "Copied. Paste it into the chat with Foreman."; }
    function fallback() {
      try {
        status.textContent = document.execCommand("copy") ? "Copied. Paste it into the chat with Foreman." : manual;
      } catch (e) {
        status.textContent = manual;
      }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(output.value).then(copied, fallback);
    } else {
      fallback();
    }
  }
}());
</script>
</body>
</html>
